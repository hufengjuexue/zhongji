name: Build APK

on:
  push:
    branches: [ master, main, mingli, huadeng ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # 提前把 NDK / CMake 装好并校验，避免 AGP 在 Gradle 任务内部隐式下载。
      # 版本取自 gradle.properties，与模块 ndkVersion 同源。
      - name: Setup Android native toolchain
        uses: ./.github/actions/setup-android-native
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Write signing config
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
        run: |
          if [ -n "$KEY_BASE64" ] && [ -n "$SIGNING_CONFIG" ]; then
            echo "$KEY_BASE64" | base64 -d > app/app.key
            echo "$SIGNING_CONFIG" > local.properties
          else
            # 密钥未配置时回退 debug 签名
            cat > local.properties << 'EOF'
          storeFile=app.key
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF
          fi
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease -x :web:buildWebUi --no-build-cache --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Collect and Rename APK
        id: rename
        run: |
          set -e
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "versionName=$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          mkdir -p release-output
          find app/build/outputs/apk -type f -name "*.apk" | while read -r f; do
            echo "Found APK: $f"
            cp "$f" "release-output/zhongji-rp-${V}-arm64-v8a.apk"
          done
          ls -la release-output/
      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: zhongji-rp-release
          path: release-output/*.apk
      - name: Automatically Publish Release
        if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.rename.outputs.version) }}
          name: 终极 RP · ZhongJi RP ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.rename.outputs.version) }}
          draft: false
          prerelease: false
          files: release-output/*.apk
