name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag'
        required: true
        default: 'v3.1.0'
      run_id:
        description: 'Source Run ID'
        required: true
        default: '40077695481'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Artifact from Run
        uses: actions/download-artifact@v4
        with:
          name: kairos-release
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Inspect Files
        run: ls -la
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: Kairos ${{ github.event.inputs.tag_name }}
          draft: false
          prerelease: false
          body: |
            ### Kairos · ${{ github.event.inputs.tag_name }}

            - **三模型协作**：`Chat × Embedding × Decision` 协同记忆检索与精准裁决。
            - **前缀缓存保护**：记忆向量尾部注入机制 (`MemoryVectorTailTransformer`)，100% 死保头部 Prompt Caching。
            - **现代化 RP 体验**：原生 Compose 极简界面、Room 时序关系图谱与 SillyTavern V2/V3 角色卡直导。
          files: "*.apk"
